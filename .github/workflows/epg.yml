name: Generar EPG

on:
  # Cada 12 horas (01:00 y 13:00 UTC -> 03:00 y 15:00 en Espana)
  schedule:
    - cron: '0 1,13 * * *'
  # Permite lanzarlo a mano desde la pestana Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # build_epg.py solo usa la biblioteca estandar: no hace falta instalar nada

      - name: Generar el XMLTV
        run: python scripts/build_epg.py --dias 7

      - name: Generar el formato compatible con TiviMate
        run: python scripts/formato_tivimate.py --salida output/mi-epg-compatible.xml

      - name: Clasificar canales sin guia
        run: python scripts/clasificar_faltantes.py || true

      - name: Comprobar el resultado
        run: |
          ls -lh output/
          python - <<'PY'
          from xml.etree import ElementTree as ET
          for f in ("output/mi-epg.xml", "output/mi-epg-compatible.xml"):
              raiz = ET.parse(f).getroot()
              canales = len(raiz.findall("channel"))
              programas = len(raiz.findall("programme"))
              print(f"{f}: {canales} canales, {programas} programas")
              if canales == 0 or programas == 0:
                  raise SystemExit(f"ERROR: {f} esta vacio")
          PY

      - name: Publicar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Solo los .gz y los informes: los XML sin comprimir van en .gitignore
          git add output/*.gz output/*.txt output/*.csv
          if git diff --staged --quiet; then
            echo "Sin cambios, no se hace commit"
          else
            git commit -m "EPG $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
