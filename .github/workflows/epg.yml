name: Generar EPG

on:
  # Cada 12 horas (01:00 y 13:00 UTC -> 03:00 y 15:00 en Espana)
  schedule:
    - cron: '0 1,13 * * *'
  # Permite lanzarlo a mano desde la pestana Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar el XMLTV
        run: python scripts/build_epg.py --dias 7

      - name: Comprimir el resultado
        run: |
          gzip -9 -k -f output/mi-epg.xml
          ls -lh output/

      - name: Publicar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/mi-epg.xml output/mi-epg.xml.gz output/mapeo.csv
          if git diff --staged --quiet; then
            echo "Sin cambios, no se hace commit"
          else
            git commit -m "EPG $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
